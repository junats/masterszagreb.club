name: Scrape Instagram Events

on:
  schedule:
    # Run once a day at 04:00 UTC (06:00 Zagreb time)
    - cron: '0 4 * * *'
  workflow_dispatch:
    # Allow manual triggers from the Actions tab

permissions:
  contents: write
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Instagram scraper
        env:
          INSTAGRAM_HANDLE: masters.zagreb
          MAX_POSTS: '30'
          INSTAGRAM_SESSION_ID: ${{ secrets.INSTAGRAM_SESSION_ID }}
          INSTAGRAM_COOKIES: ${{ secrets.INSTAGRAM_COOKIES }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: node scripts/scrape-instagram.js

      - name: Run Instagram story scraper
        env:
          INSTAGRAM_HANDLE: masters.zagreb
          INSTAGRAM_SESSION_ID: ${{ secrets.INSTAGRAM_SESSION_ID }}
          INSTAGRAM_COOKIES: ${{ secrets.INSTAGRAM_COOKIES }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: node scripts/scrape-stories.js

      - name: Check for changes
        id: changes
        run: |
          git add data/ assests/events/
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "📭 No new events found"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "📬 New events detected!"
          fi

      - name: Commit, push, and deploy
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m "🤖 Update events from Instagram"
          git push
          echo "🚀 Triggering deployer pipeline..."
          gh workflow run pipeline.yaml --ref main || echo "Deployer trigger skipped"
