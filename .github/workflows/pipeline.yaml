name: deployer
run-name: Deployer ${{ inputs.event }}

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Docker Login
        uses: docker/login-action@v4
        with:
          registry: registry.nivas.hr
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Checkout
        uses: actions/checkout@v5
        # with:
          # submodules: true
          # ssh-key: ${{ secrets.SSH_KEY_CI }}
          # ssh-strict: true
          # ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: registry.nivas.hr/markupmark/masterszagreb

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            mkdir -p /srv/masterszagreb.club
            cat << 'EOF' > /srv/masterszagreb.club/docker-compose.yml
            services:
              masterszagreb:
                image: registry.nivas.hr/markupmark/masterszagreb
                pull_policy: always
                restart: always
                ports:
                  - "8058:80"
                deploy:
                  resources:
                    limits:
                      cpus: '1'
                    reservations:
                      cpus: '0.5'
            EOF
            cd /srv/masterszagreb.club
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login registry.nivas.hr -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            docker compose pull
            docker compose up -d
