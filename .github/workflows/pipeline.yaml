name: deployer
run-name: Deployer ${{ inputs.event }}

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Docker Login
        uses: docker/login-action@v4
        with:
          registry: registry.nivas.hr
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Checkout
        uses: actions/checkout@v5
        # with:
          # submodules: true
          # ssh-key: ${{ secrets.SSH_KEY_CI }}
          # ssh-strict: true
          # ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: registry.nivas.hr/markupmark/masterszagreb

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "=== RUNNING CONTAINERS ==="
            docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"
            echo "=== ALL CONTAINERS ==="
            docker ps -a --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"
            echo "=== SEARCH FOR masters ON ENTIRE SYSTEM ==="
            find / -maxdepth 3 -iname "*masters*" 2>/dev/null || true
            echo "=== REVERSE PROXY NGINX / TRAEFIK CONFIGS ==="
            ls -la /etc/nginx/sites-enabled/ 2>/dev/null || true
            grep -rn "masterszagreb" /etc/nginx/ 2>/dev/null || true
            grep -rn "masterszagreb" /etc/caddy/ 2>/dev/null || true
