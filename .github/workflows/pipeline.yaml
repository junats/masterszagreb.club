name: deployer
run-name: Deployer ${{ inputs.event }}

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Docker Login
        uses: docker/login-action@v4
        with:
          registry: registry.nivas.hr
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Checkout
        uses: actions/checkout@v5
        # with:
          # submodules: true
          # ssh-key: ${{ secrets.SSH_KEY_CI }}
          # ssh-strict: true
          # ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: registry.nivas.hr/markupmark/masterszagreb

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "=== GETTRUETRACK COMPOSE ==="
            cat /srv/gettruetrack.app/docker-compose.yml 2>/dev/null || cat /srv/gettruetrack.app/compose.yml 2>/dev/null || true
            echo "=== SYSTEM SERVICES / CADDY / NGINX / APACHE ==="
            systemctl list-units --type=service --state=running 2>/dev/null | grep -E "nginx|caddy|apache|traefik|proxy|cloudflared" || true
            echo "=== CLOUDFLARE TUNNEL ==="
            ps aux | grep -E "cloudflared|caddy|nginx" | grep -v grep || true
