<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MASTERS Zagreb — Official Merchandise & Club Apparel</title>
    <meta name="title" content="MASTERS Zagreb — Official Merchandise & Club Apparel">
    <meta name="description"
        content="Official club apparel and merchandise for MASTERS Zagreb. Premium heavyweight cotton t-shirts, underground electronic music prints, and limited edition drops.">
    <meta name="keywords" content="Masters Zagreb merch, techno t-shirt, club merchandise, underground apparel, Zagreb club t-shirt">
    <meta name="robots" content="index, follow">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://masterszagreb.club/merch.html">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://masterszagreb.club/merch.html">
    <meta property="og:title" content="MASTERS Zagreb — Official Merchandise">
    <meta property="og:description" content="Official club apparel and merchandise for MASTERS Zagreb. Limited edition heavyweight t-shirts.">
    <meta property="og:image" content="https://masterszagreb.club/tshirt_masters_classic_1766707705468.png">
    <meta property="og:site_name" content="MASTERS Zagreb">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=1786307681064">
    <link rel="stylesheet" href="merch.css?v=1786307681064">
</head>

<body>
    <!-- Film grain overlay -->
    <div class="grain-overlay"></div>

    <!-- Back to Home Link -->
    <a href="index.html" class="back-link">← HOME</a>

    <!-- Merch Container -->
    <div class="merch-container">
        <h1 class="merch-title">OFFICIAL MERCH</h1>

        <div class="merch-grid">
            <!-- T-Shirt 1 -->
            <div class="merch-item">
                <div class="merch-image-placeholder">
                    <img src="tshirt_masters_classic_1766707705468.png" alt="MASTERS Classic Tee" class="tshirt-image">
                </div>
                <h3 class="merch-name">MASTERS Classic Tee</h3>
                <p class="merch-price">€25</p>
                <button class="merch-btn">ADD TO CART</button>
            </div>

            <!-- T-Shirt 2 -->
            <div class="merch-item">
                <div class="merch-image-placeholder">
                    <div class="tshirt-preview dark">
                        <div class="tshirt-logo">M</div>
                    </div>
                </div>
                <h3 class="merch-name">MASTERS Icon Tee</h3>
                <p class="merch-price">€25</p>
                <button class="merch-btn">ADD TO CART</button>
            </div>

            <!-- T-Shirt 3 -->
            <div class="merch-item">
                <div class="merch-image-placeholder">
                    <img src="tshirt_masters_est_1766707719945.png" alt="MASTERS Est. Tee" class="tshirt-image">
                </div>
                <h3 class="merch-name">MASTERS Est. Tee</h3>
                <p class="merch-price">€25</p>
                <button class="merch-btn">ADD TO CART</button>
            </div>

            <!-- T-Shirt 4 -->
            <div class="merch-item">
                <div class="merch-image-placeholder">
                    <img src="tshirt_masters_nightclub_1766707732765.png" alt="MASTERS Nightclub Tee"
                        class="tshirt-image">
                </div>
                <h3 class="merch-name">MASTERS Nightclub Tee</h3>
                <p class="merch-price">€25</p>
                <button class="merch-btn">ADD TO CART</button>
            </div>

            <!-- T-Shirt 5 -->
            <div class="merch-item">
                <div class="merch-image-placeholder">
                    <img src="tshirt_masters_vertical_1766707745934.png" alt="MASTERS Vertical Tee"
                        class="tshirt-image">
                </div>
                <h3 class="merch-name">MASTERS Vertical Tee</h3>
                <p class="merch-price">€25</p>
                <button class="merch-btn">ADD TO CART</button>
            </div>

            <!-- T-Shirt 6 -->
            <div class="merch-item">
                <div class="merch-image-placeholder">
                    <img src="tshirt_masters_premium_1766707762669.png" alt="MASTERS Premium Tee" class="tshirt-image">
                </div>
                <h3 class="merch-name">MASTERS Premium Tee</h3>
                <p class="merch-price">€30</p>
                <button class="merch-btn">ADD TO CART</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.gsap) {
                gsap.from('.merch-title', { autoAlpha: 0, y: -30, duration: 0.6, ease: 'power3.out' });
                gsap.from('.merch-item', { autoAlpha: 0, y: 40, scale: 0.95, stagger: 0.08, duration: 0.55, ease: 'back.out(1.2)' });
                
                document.querySelectorAll('.merch-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.preventDefault();
                        gsap.fromTo(btn, { scale: 0.9 }, { scale: 1, duration: 0.3, ease: 'back.out(2)' });
                        const originalText = btn.textContent;
                        btn.textContent = '✓ ADDED';
                        btn.style.borderColor = '#00ff41';
                        btn.style.color = '#00ff41';
                        setTimeout(() => {
                            btn.textContent = originalText;
                            btn.style.borderColor = '';
                            btn.style.color = '';
                        }, 1200);
                    });
                });
            }
        });
    </script>
    <script src="main.js?v=1786307681064"></script>
</body>

</html>
